name: Build and Deploy WASM to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Compile to WebAssembly with CMake
        run: |
          mkdir build-web
          cd build-web
          
          # Force Raylib to build for Web/Emscripten platform
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -DPLATFORM=Web
          
          # Build the project
          cmake --build .

      - name: Stage Web Files for Deployment
        run: |
          mkdir -p ./dist
          
          # 1. Copy generated WebAssembly build output
          cp build-web/*.html ./dist/ 2>/dev/null || true
          cp build-web/*.js ./dist/ 2>/dev/null || true
          cp build-web/*.wasm ./dist/ 2>/dev/null || true
          cp build-web/*.data ./dist/ 2>/dev/null || true

          # 2. Rename executable HTML to index.html if needed
          if [ -f ./dist/GrandTourColdFront.html ] && [ ! -f ./dist/index.html ]; then
            mv ./dist/GrandTourColdFront.html ./dist/index.html
          fi

          # 3. Copy static web folder (icons, manifest, etc.) into ./dist/web/
          if [ -d "web" ]; then
            cp -r web ./dist/
          fi

          # Debug: print out directory contents to verify structure
          ls -la ./dist
          ls -la ./dist/web

      # Upload the clean web files as a Pages artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4