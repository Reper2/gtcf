name: Draft Release Assets

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0

permissions:
  contents: write # Grants permission to upload assets and write release notes

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: GrandTourColdFront-linux.tar.gz
            exe_suffix: ""
          - os: windows-latest
            artifact_name: GrandTourColdFront-windows.zip
            exe_suffix: ".exe"
          - os: macos-latest
            artifact_name: GrandTourColdFront-macos.zip
            exe_suffix: ""

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history so the changelog engine can see prior tags

      # --- Linux Build Dependencies ---
      - name: Install Linux Build Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev

      # --- Windows Toolchain Setup (MinGW GCC & Ninja) ---
      - name: Configure MinGW Package Engine
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          mingw64: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      # --- CMake Build Step ---
      # Forces Windows runner to use the MinGW Ninja generator instead of MSVC
      - name: Configure CMake
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build Project
        run: |
          cmake --build build --config Release

      # --- Stage Files into Staging Directory ---
      - name: Create Release Staging Directory
        shell: bash
        run: |
          mkdir -p release_stage
          
          # Match your exact CMake target name
          if [ -f "build/Release/GrandTourColdFront${{ matrix.exe_suffix }}" ]; then
            cp "build/Release/GrandTourColdFront${{ matrix.exe_suffix }}" release_stage/
          elif [ -f "build/GrandTourColdFront${{ matrix.exe_suffix }}" ]; then
            cp "build/GrandTourColdFront${{ matrix.exe_suffix }}" release_stage/
          fi

          # Safe staging copies for supplementary files (only copy if they exist)
          [ -d "resources" ] && cp -r resources release_stage/ || echo "No resources folder found"
          [ -f "README.md" ] && cp README.md release_stage/ || echo "No README found"
          [ -f "LICENSE.txt" ] && cp LICENSE.txt release_stage/ || echo "No LICENSE found"

      # --- Locate and Bundle Windows MinGW Runtime DLLs ---
      - name: Bundle Windows GCC DLLs
        if: runner.os == 'Windows'
        shell: bash
        run: |
          copy_if_exists() {
            local dll_name="$1"
            local found_path=$(find /c/msys64/mingw64/bin/ -name "$dll_name" 2>/dev/null | head -n 1)
            if [ -n "$found_path" ]; then
              cp "$found_path" release_stage/
              echo "Bundled $dll_name"
            else
              echo "Warning: Could not locate $dll_name"
            fi
          }
          copy_if_exists "libgcc_s_seh-1.dll"
          copy_if_exists "libstdc++-6.dll"
          copy_if_exists "libwinpthread-1.dll"

      # --- Archive Generation ---
      - name: Archive Release Package (Linux)
        if: runner.os == 'Linux'
        run: |
          tar -czvf ${{ matrix.artifact_name }} -C release_stage .

      - name: Archive Release Package (Windows / macOS)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          cd release_stage
          zip -r ../${{ matrix.artifact_name }} .
          cd ..

      # --- Upload Artifacts & Generate Automated Changelog ---
      - name: Upload Build Artifacts to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}
          draft: true
          generate_release_notes: true # AUTOMATED CHANGELOG GENERATOR!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
